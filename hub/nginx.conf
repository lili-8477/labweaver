worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $ws_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Service IDs are 64-hex keys, which overflow the default 64-byte map
    # bucket ("could not build map_hash" at startup).
    map_hash_bucket_size 128;

    # Routing key for per-user endpoints: the service ID, from an
    # `Authorization: Bearer` header (glasses app) or else the frontend's
    # lw_service cookie. service-map.conf resolves $lw_key to a workspace
    # owner; regenerate it with scripts/gen-service-map.sh after adding or
    # removing a user.
    map $http_authorization $lw_key {
        "~^Bearer\s+(?<token>[0-9a-f]{64})$" $token;
        default $cookie_lw_service;
    }
    include /etc/nginx/service-map.conf;

    # $glasses_proxy_secret, rendered from hub/nginx-templates/ (see there).
    include /etc/nginx/conf.d/glasses-proxy-secret.conf;

    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    # Docker embedded DNS — needed because /upload/ proxy_pass uses a
    # runtime variable ($ws_user). Without an explicit resolver,
    # nginx fails the lookup at request time with "host not found".
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        # NATS WebSocket endpoint for the frontend.
        location /ws/ {
            proxy_pass http://nats:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            limit_req zone=ws_limit burst=20 nodelay;
        }

        # NATS monitoring (htpasswd-gated).
        location /nats/ {
            auth_basic "claude-bioflow admin";
            auth_basic_user_file /etc/nginx/htpasswd;
            proxy_pass http://nats:8222/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Shared downloads (org-wide). URL: /download/shared/<path>
        # Served without a user prefix so every authenticated user sees the
        # same shared workspace, matching the /workspace/shared/ view inside
        # the container. This location takes precedence over /download/ below
        # because nginx picks the most specific prefix match.
        location /download/shared/ {
            # No cookie, or one that matches no provisioned user. There is
            # nothing to prompt for — the service ID comes from the app.
            if ($ws_user = "") { return 403; }
            rewrite ^/download/(shared/.*)$ /$1 break;
            root /downloads;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        # Per-user uploads. URL: /upload/<path> →
        #   http://claude-bioflow-<cookie-user>:5000/upload/<path>
        # The adapter HTTP server inside the user's container streams the
        # body to disk under /workspace/local_projects/. nginx authenticates
        # by the lw_service cookie; $ws_user is the routing key, so a user
        # can only target their own container.
        location /upload/ {
            # No cookie, or one that matches no provisioned user. There is
            # nothing to prompt for — the service ID comes from the app.
            if ($ws_user = "") { return 403; }
            limit_req zone=upload_limit burst=20 nodelay;

            client_max_body_size 2g;
            proxy_request_buffering off;        # stream straight through
            proxy_send_timeout 30m;
            proxy_read_timeout 30m;

            proxy_pass http://claude-bioflow-$ws_user:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $ws_user;
        }

        # Glasses app uploads (docs/UPLOAD_API.md in lili-8477/labweaver-glasses).
        # The indexer stores them under hub/recordings/<user>/. The token is
        # stripped here, so the indexer only ever sees the resolved owner.
        location /api/glasses/ {
            if ($ws_user = "") { return 401; }
            limit_req zone=upload_limit burst=40 nodelay;

            client_max_body_size 64m;           # matches GLASSES_MAX_CHUNK_BYTES
            # Variable upstream: resolved per request, so nginx still starts
            # when the indexer is down.
            set $glasses_upstream claude-bioflow-indexer:8400;
            proxy_pass http://$glasses_upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-User $ws_user;
            proxy_set_header X-Glasses-Proxy-Secret $glasses_proxy_secret;
            proxy_read_timeout 120s;
        }

        # Glasses downloads. The indexer answers
        # GET /api/glasses/recordings/{id}/parts/{n} with X-Accel-Redirect to
        # this path after checking the owner; nginx then streams the file with
        # Range (206), ETag and sendfile. `internal`: clients cannot request it.
        # ^~ so the site's \.mp4$ regex location can never capture it.
        location ^~ /_glasses_files/ {
            internal;
            alias /recordings/;
            add_header Cache-Control "private, no-cache";
        }

        # Per-user share-snapshot proxy. URL: /share-snapshot/<id>/file?path=<rel>
        # Routed to the user's adapter HTTP server (port 5000), which injects
        # actor=<remote_user> and forwards to the indexer. Rate-limited shared
        # with /upload/ since both target the same per-user adapter.
        location /share-snapshot/ {
            # No cookie, or one that matches no provisioned user. There is
            # nothing to prompt for — the service ID comes from the app.
            if ($ws_user = "") { return 403; }
            limit_req zone=upload_limit burst=10 nodelay;

            proxy_pass http://claude-bioflow-$ws_user:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $ws_user;
            proxy_read_timeout 60s;
        }

        # Per-user downloads. URL: /download/<path>  →  /downloads/<cookie-user>/<path>
        # Example: /download/local_projects/pbmc3k_celltypist/data/pbmc3k.h5ad
        # Streams directly from disk — no NATS size limit.
        # .env and friends are mode 0600 so nginx (unprivileged) can't read them.
        location /download/ {
            # No cookie, or one that matches no provisioned user. There is
            # nothing to prompt for — the service ID comes from the app.
            if ($ws_user = "") { return 403; }
            rewrite ^/download/(.*)$ /$ws_user/$1 break;
            root /downloads;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        # Public landing page at the site root. Authored as
        # frontend/public/landing.html; Vite copies public/ verbatim into
        # dist/, so it ships with the same `npm run build` as the app.
        location = / {
            root /usr/share/nginx/html;
            try_files /landing.html =404;
        }

        # The app itself (Vue SPA, NATS WebSocket client). Everything under
        # /app renders the same SPA shell — the landing page's "Connect to
        # LabWeaver" button links here with ?nats=<ws endpoint> prefilled.
        location /app {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            # The SPA shell must never be cached: asset filenames are content-hashed
            # and `vite build --clean` deletes the old ones, so a stale index.html
            # points at files that no longer exist.
            add_header Cache-Control "no-store" always;
        }

        # Frontend static build. Run `cd frontend && npm ci && npm run build`
        # before `docker compose up -d`.
        location / {
            root /usr/share/nginx/html;
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;

            # ^~ stops nginx testing the media regex below, which would
            # otherwise win over this prefix and downgrade hashed assets.
            location ^~ /assets/ {
                # Never fall back to index.html here — a missing hashed asset must
                # 404 loudly, not return HTML that the browser tries to parse as JS.
                try_files $uri =404;
                expires 30d;
                add_header Cache-Control "public, immutable";
            }

            # Media in public/ keeps a stable filename, so it cannot be immutable
            # like a hashed asset — but it must not inherit the shell's no-store
            # either, or the 2 MB hero film is refetched on every page view.
            location ~* \.(mp4|webm|jpg|jpeg|png|svg|ico|woff2?)$ {
                try_files $uri =404;
                # add_header alone — `expires` would emit a second, duplicate
                # Cache-Control alongside this one.
                add_header Cache-Control "public, max-age=604800" always;
            }
        }
    }
}
